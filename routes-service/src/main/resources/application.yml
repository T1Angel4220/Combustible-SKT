server:
  port: 8083
  
spring:
  application:
    name: routes-service
  
  datasource:
    url: jdbc:postgresql://localhost:5432/routes_db
    username: ${DB_USERNAME:routes_user}
    password: ${DB_PASSWORD:routes_pass}
    driver-class-name: org.postgresql.Driver
    
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        
  profiles:
    active: dev

# Management endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# Logging configurations  
logging:
  level:
    com.skt.combustible.routes: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

# gRPC Configuration
grpc:
  server:
    port: 9093
    
# Service Discovery (para comunicación entre microservicios)
service:
  urls:
    drivers-service: http://localhost:8081
    vehicles-service: http://localhost:8082
    fuel-service: http://localhost:8084
    auth-service: http://localhost:8085
