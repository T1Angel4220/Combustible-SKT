version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: combustible-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_INITDB_DATABASE: combustible_db
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - ./init-mongodb.js:/docker-entrypoint-initdb.d/init-mongodb.js:ro
    networks:
      - combustible-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Drivers Service
  drivers-service:
    build:
      context: .
      dockerfile: ./src/drivers-service/Dockerfile
    container_name: drivers-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      MONGODB_URI: mongodb://admin:admin123@mongodb:27017/drivers_db?authSource=admin
    ports:
      - "8081:8081"
      - "9091:9091"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - combustible-network

volumes:
  mongodb_data:

networks:
  combustible-network:
    driver: bridge
