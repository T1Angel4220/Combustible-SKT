# Configuración simplificada para desarrollo local
# Solo PostgreSQL en Docker, drivers-service ejecutado localmente

services:
  # Base de datos PostgreSQL
  postgres-db:
    image: postgres:15-alpine
    container_name: combustible-postgres-local
    environment:
      POSTGRES_DB: combustible_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./00-init-schemas.sql:/docker-entrypoint-initdb.d/00-init-schemas.sql
      - ./bd.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./init-db.sql:/docker-entrypoint-initdb.d/02-init.sql
    networks:
      - combustible-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

networks:
  combustible-network:
    driver: bridge
