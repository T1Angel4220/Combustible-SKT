version: '3.8'

services:
  # PostgreSQL Databases
  drivers-db:
    image: postgres:15-alpine
    container_name: drivers-db
    environment:
      POSTGRES_DB: drivers_db
      POSTGRES_USER: drivers_user
      POSTGRES_PASSWORD: drivers_pass
    ports:
      - "5432:5432"
    volumes:
      - drivers_data:/var/lib/postgresql/data
    networks:
      - combustible-network

  vehicles-db:
    image: mongo:7.0
    container_name: vehicles-db
    environment:
      MONGO_INITDB_ROOT_USERNAME: vehicles_user
      MONGO_INITDB_ROOT_PASSWORD: vehicles_pass
      MONGO_INITDB_DATABASE: vehicles_db
    ports:
      - "27017:27017"
    volumes:
      - vehicles_data:/data/db
    networks:
      - combustible-network

  routes-db:
    image: postgres:15-alpine
    container_name: routes-db
    environment:
      POSTGRES_DB: routes_db
      POSTGRES_USER: routes_user
      POSTGRES_PASSWORD: routes_pass
    ports:
      - "5434:5432"
    volumes:
      - routes_data:/var/lib/postgresql/data
    networks:
      - combustible-network

  fuel-db:
    image: postgres:15-alpine
    container_name: fuel-db
    environment:
      POSTGRES_DB: fuel_db
      POSTGRES_USER: fuel_user
      POSTGRES_PASSWORD: fuel_pass
    ports:
      - "5435:5432"
    volumes:
      - fuel_data:/var/lib/postgresql/data
    networks:
      - combustible-network

  auth-db:
    image: postgres:15-alpine
    container_name: auth-db
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: auth_user
      POSTGRES_PASSWORD: auth_pass
    ports:
      - "5436:5432"
    volumes:
      - auth_data:/var/lib/postgresql/data
    networks:
      - combustible-network

  # Microservices
  drivers-service:
    build:
      context: .
      dockerfile: src/drivers-service/Dockerfile
    container_name: drivers-service
    ports:
      - "8081:8081"
      - "9091:9091"
    environment:
      DB_USERNAME: drivers_user
      DB_PASSWORD: drivers_pass
    depends_on:
      - drivers-db
    networks:
      - combustible-network

  vehicles-service:
    build:
      context: .
      dockerfile: src/vehicles-service/Dockerfile
    container_name: vehicles-service
    ports:
      - "8082:8082"
      - "9092:9092"
    environment:
      DB_USERNAME: vehicles_user
      DB_PASSWORD: vehicles_pass
    depends_on:
      - vehicles-db
    networks:
      - combustible-network

  routes-service:
    build:
      context: .
      dockerfile: src/routes-service/Dockerfile
    container_name: routes-service
    ports:
      - "8083:8083"
      - "9093:9093"
    environment:
      DB_USERNAME: routes_user
      DB_PASSWORD: routes_pass
    depends_on:
      - routes-db
    networks:
      - combustible-network

  fuel-service:
    build:
      context: .
      dockerfile: src/fuel-service/Dockerfile
    container_name: fuel-service
    ports:
      - "8084:8084"
      - "9094:9094"
    environment:
      DB_USERNAME: fuel_user
      DB_PASSWORD: fuel_pass
    depends_on:
      - fuel-db
    networks:
      - combustible-network

  auth-service:
    build:
      context: .
      dockerfile: src/auth-service/Dockerfile
    container_name: auth-service
    ports:
      - "8085:8085"
      - "9095:9095"
    environment:
      DB_USERNAME: auth_user
      DB_PASSWORD: auth_pass
      JWT_SECRET: mySecretKey1234567890123456789012345
    depends_on:
      - auth-db
    networks:
      - combustible-network

  gateway-service:
    build:
      context: .
      dockerfile: src/gateway-service/Dockerfile
    container_name: gateway-service
    ports:
      - "8080:8080"
    depends_on:
      - drivers-service
      - vehicles-service
      - routes-service
      - fuel-service
      - auth-service
    networks:
      - combustible-network

volumes:
  drivers_data:
  vehicles_data:
  routes_data:
  fuel_data:
  auth_data:

networks:
  combustible-network:
    driver: bridge
