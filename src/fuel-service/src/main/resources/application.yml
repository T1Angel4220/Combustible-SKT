server:
  port: 8084

spring:
  application:
    name: fuel-service

  data:
    mongodb:
      uri: mongodb://localhost:27017/fuel_db
      database: fuel_db

  profiles:
    active: dev

# Management endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# Logging configurations
logging:
  level:
    com.skt.combustible.fuel: DEBUG
    org.springframework.web: DEBUG
    org.springframework.data.mongodb: DEBUG
    org.mongodb.driver: DEBUG
    net.devh.boot.grpc: DEBUG
    io.grpc: DEBUG

# gRPC Configuration
grpc:
  server:
    port: 9094
    address: 0.0.0.0
    security:
      enabled: false
    reflection-service-enabled: true
    health-service-enabled: true
    max-inbound-message-size: 4194304
    max-inbound-metadata-size: 8192
  client:
    routes-service:
      host: ${GRPC_ROUTES_HOST:localhost}
      port: ${GRPC_ROUTES_PORT:9093}
    vehicles-service:
      host: ${GRPC_VEHICLES_HOST:localhost}
      port: ${GRPC_VEHICLES_PORT:9092}

# Service Discovery (para comunicación entre microservicios)
service:
  urls:
    drivers-service: http://localhost:8081
    vehicles-service: http://localhost:8082
    routes-service: http://localhost:8083
    auth-service: http://localhost:8085

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:mySecretKey1234567890123456789012345}
  expiration: 86400000 # 24 horas en milisegundos
