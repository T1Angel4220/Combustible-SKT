server:
  port: ${PORT:8083}

spring:
  application:
    name: routes-service
  data:
    mongodb:
      uri: ${MONGODB_ATLAS_URI}
      database: routes_db

# Management endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# Logging configurations
logging:
  level:
    com.skt.combustible.routes: INFO
    org.springframework.web: INFO

# gRPC Configuration
grpc:
  server:
    port: 9093
    address: 0.0.0.0
    security:
      enabled: false
    reflection-service-enabled: true
    health-service-enabled: true
    max-inbound-message-size: 4194304
    max-inbound-metadata-size: 8192
  client:
    drivers-service:
      host: ${GRPC_DRIVERS_HOST:drivers-service.onrender.com}
      port: ${GRPC_DRIVERS_PORT:9091}
    vehicles-service:
      host: ${GRPC_VEHICLES_HOST:vehicles-service.onrender.com}
      port: ${GRPC_VEHICLES_PORT:9092}

# Service Discovery (para comunicación HTTP REST si es necesario)
service:
  urls:
    drivers-service: https://${DRIVERS_SERVICE_URL:drivers-service.onrender.com}
    vehicles-service: https://${VEHICLES_SERVICE_URL:vehicles-service.onrender.com}
    fuel-service: https://${FUEL_SERVICE_URL:fuel-service.onrender.com}
    auth-service: https://${AUTH_SERVICE_URL:auth-service.onrender.com}

# JWT Configuration
jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}

# Google Maps API Configuration (opcional)
google:
  maps:
    api:
      key: ${GOOGLE_MAPS_API_KEY:}
      enabled: ${GOOGLE_MAPS_ENABLED:false}

# OpenStreetMap / OpenRouteService Configuration
openstreetmap:
  enabled: ${OPENSTREETMAP_ENABLED:true}

openrouteservice:
  api:
    key: ${OPENROUTESERVICE_API_KEY:}

