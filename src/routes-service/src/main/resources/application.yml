server:
  port: 8083

spring:
  application:
    name: routes-service

  data:
    mongodb:
      uri: mongodb://localhost:27017/routes_db
      database: routes_db

  profiles:
    active: dev

# Management endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# Logging configurations
logging:
  level:
    com.skt.combustible.routes: DEBUG
    org.springframework.web: DEBUG
    org.springframework.data.mongodb: DEBUG
    org.mongodb.driver: DEBUG

# gRPC Configuration
grpc:
  server:
    port: 9093
    address: 0.0.0.0
    security:
      enabled: false
    reflection-service-enabled: true
    health-service-enabled: true
    max-inbound-message-size: 4194304
    max-inbound-metadata-size: 8192
  client:
    drivers-service:
      host: ${GRPC_DRIVERS_HOST:localhost}
      port: ${GRPC_DRIVERS_PORT:9091}
    vehicles-service:
      host: ${GRPC_VEHICLES_HOST:localhost}
      port: ${GRPC_VEHICLES_PORT:9092}

# Service Discovery (para comunicación entre microservicios)
service:
  urls:
    drivers-service: http://localhost:8081
    vehicles-service: http://localhost:8082
    fuel-service: http://localhost:8084
    auth-service: http://localhost:8085

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:mySecretKey1234567890123456789012345}
  expiration: 86400000 # 24 horas en milisegundos

# Google Maps API Configuration (opcional)
google:
  maps:
    api:
      key: ${GOOGLE_MAPS_API_KEY:}
      enabled: ${GOOGLE_MAPS_ENABLED:false}

# OpenStreetMap / OpenRouteService Configuration (gratuito, sin tarjeta)
openstreetmap:
  enabled: ${OPENSTREETMAP_ENABLED:true}

openrouteservice:
  api:
    key: ${OPENROUTESERVICE_API_KEY:}  # Opcional: obtener gratis en https://openrouteservice.org/
