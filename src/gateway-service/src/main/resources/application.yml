server:
  port: 8080

spring:
  application:
    name: gateway-service
    
  cloud:
    gateway:
      # Deshabilitar funcionalidades problemáticas de gRPC
      grpc:
        enabled: false
      routes:
        # Drivers Service
        - id: drivers-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/drivers/**
          filters:
            - StripPrefix=3
            
        # Vehicles Service  
        - id: vehicles-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/vehicles/**
          filters:
            - StripPrefix=3
            
        # Routes Service
        - id: routes-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/routes/**
          filters:
            - StripPrefix=3
            
        # Fuel Service
        - id: fuel-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/v1/fuel/**
          filters:
            - StripPrefix=3
            
        # Auth Service
        - id: auth-service
          uri: http://localhost:8085
          predicates:
            - Path=/api/v1/auth/**
          filters:
            - StripPrefix=3

# Management endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,gateway
  endpoint:
    health:
      show-details: always

# gRPC Configuration
grpc:
  client:
    drivers-service:
      address: 'static://localhost:9091'
      enableKeepAlive: true
      keepAliveWithoutCalls: true
    vehicles-service:
      address: 'static://localhost:9092'
      enableKeepAlive: true
      keepAliveWithoutCalls: true
    routes-service:
      address: 'static://localhost:9093'
      enableKeepAlive: true
      keepAliveWithoutCalls: true
    fuel-service:
      address: 'static://localhost:9094'
      enableKeepAlive: true
      keepAliveWithoutCalls: true
    auth-service:
      address: 'static://localhost:9095'
      enableKeepAlive: true
      keepAliveWithoutCalls: true

# Logging configurations  
logging:
  level:
    com.skt.combustible.gateway: DEBUG
    org.springframework.cloud.gateway: DEBUG
