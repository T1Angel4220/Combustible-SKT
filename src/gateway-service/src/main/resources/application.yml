server:
  port: 8090

spring:
  application:
    name: gateway-service

# Configuración gRPC para comunicación con microservicios
grpc:
  client:
    drivers-service:
      address: static://localhost:9091
      negotiation-type: plaintext


# Management endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# Logging configurations  
logging:
  level:
    com.skt.combustible.gateway: DEBUG
