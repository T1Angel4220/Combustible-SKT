server:
  port: 8080

spring:
  application:
    name: gateway-service
    
  cloud:
    gateway:
      # Deshabilitar auto-configuración de gRPC que causa conflictos
      grpc:
        enabled: false
      routes:
        # Drivers Service
        - id: drivers-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/drivers/**
          filters:
            - StripPrefix=3
            
        # Vehicles Service  
        - id: vehicles-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/vehicles/**
          filters:
            - StripPrefix=3
            
        # Routes Service
        - id: routes-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/routes/**
          filters:
            - StripPrefix=3
            
        # Fuel Service
        - id: fuel-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/v1/fuel/**
          filters:
            - StripPrefix=3
            
        # Auth Service
        - id: auth-service
          uri: http://localhost:8085
          predicates:
            - Path=/api/v1/auth/**
          filters:
            - StripPrefix=3

# Management endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,gateway
  endpoint:
    health:
      show-details: always

# Logging configurations  
logging:
  level:
    com.skt.combustible.gateway: DEBUG
    org.springframework.cloud.gateway: DEBUG
