server:
  port: ${PORT:8090}
  # Configuración para Render (detrás de proxy/load balancer)
  forward-headers-strategy: native
  use-forward-headers: true
  # Confiar en los headers de proxy para obtener el protocolo y host correcto
  tomcat:
    remoteip:
      protocol-header: X-Forwarded-Proto
      remote-ip-header: X-Forwarded-For
      host-header: X-Forwarded-Host

spring:
  application:
    name: gateway-service
  devtools:
    restart:
      enabled: false

# Management endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# gRPC Configuration - Para servicios públicos usamos HTTP REST principalmente
# gRPC puede no funcionar bien sobre HTTPS en servicios públicos
grpc:
  client:
    drivers-service:
      address: "static://${GRPC_DRIVERS_HOST:drivers-service.onrender.com}:9091"
      enableKeepAlive: true
      keepAliveWithoutCalls: true
    vehicles-service:
      address: "static://${GRPC_VEHICLES_HOST:vehicles-service.onrender.com}:9092"
      enableKeepAlive: true
      keepAliveWithoutCalls: true
    routes-service:
      address: "static://${GRPC_ROUTES_HOST:routes-service.onrender.com}:9093"
      enableKeepAlive: true
      keepAliveWithoutCalls: true
    fuel-service:
      address: "static://${GRPC_FUEL_HOST:fuel-service.onrender.com}:9094"
      enableKeepAlive: true
      keepAliveWithoutCalls: true
    auth-service:
      address: "static://${GRPC_AUTH_HOST:auth-service.onrender.com}:9095"
      enableKeepAlive: true
      keepAliveWithoutCalls: true

# Service Discovery - URLs HTTPS de los servicios públicos
# El Gateway usa principalmente HTTP REST para comunicarse
service:
  urls:
    drivers-service: https://${DRIVERS_SERVICE_URL}
    vehicles-service: https://${VEHICLES_SERVICE_URL}
    routes-service: https://${ROUTES_SERVICE_URL}
    fuel-service: https://${FUEL_SERVICE_URL}
    auth-service: https://${AUTH_SERVICE_URL}

# Logging configurations
logging:
  level:
    com.skt.combustible.gateway: INFO
    org.springframework.web: INFO
    com.skt.combustible.gateway.config.CorsFilter: INFO  # Cambiar a INFO para ver logs en producción
    com.skt.combustible.gateway.config.CorsResponseBodyAdvice: INFO

