server:
  port: 8085
  
spring:
  application:
    name: auth-service
  
  # Configuración H2 para pruebas rápidas (sin MongoDB)
  datasource:
    url: jdbc:h2:mem:authdb
    driver-class-name: org.h2.Driver
    username: sa
    password: 
    
  h2:
    console:
      enabled: true
      path: /h2-console
      
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
        

# Security JWT Configuration
jwt:
  secret: mySecretKey1234567890123456789012345
  expiration: 86400000 # 24 hours in milliseconds

# Management endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,h2-console
  endpoint:
    health:
      show-details: always

# Logging configurations  
logging:
  level:
    com.skt.combustible.auth: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG

# gRPC Configuration
grpc:
  server:
    port: 9095
    
# Service Discovery
service:
  urls:
    drivers-service: http://localhost:8081
    vehicles-service: http://localhost:8082
    routes-service: http://localhost:8083
    fuel-service: http://localhost:8084
