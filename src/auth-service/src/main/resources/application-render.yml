server:
  port: ${PORT:8085}
  # Render asigna PORT automáticamente para Web Services

spring:
  application:
    name: auth-service
  data:
    mongodb:
      uri: ${MONGODB_ATLAS_URI}
      database: auth_db

# Security JWT Configuration
jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000} # 24 hours in milliseconds
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000} # 7 days in milliseconds

# Management endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# Logging configurations
logging:
  level:
    com.skt.combustible.auth: INFO
    org.springframework.web: INFO

# gRPC Configuration - DESHABILITADO en Render
# Render hace health checks HTTP que no son compatibles con gRPC
# Usamos HTTP REST para comunicación entre servicios públicos
grpc:
  server:
    port: -1  # Deshabilitar servidor gRPC (-1 desactiva el servidor)
    enabled: false  # Deshabilitar completamente el servidor gRPC

# Service Discovery (para comunicación HTTP REST si es necesario)
service:
  urls:
    drivers-service: https://${DRIVERS_SERVICE_URL:drivers-service.onrender.com}
    vehicles-service: https://${VEHICLES_SERVICE_URL:vehicles-service.onrender.com}
    routes-service: https://${ROUTES_SERVICE_URL:routes-service.onrender.com}
    fuel-service: https://${FUEL_SERVICE_URL:fuel-service.onrender.com}

