server:
  port: 8082
  
spring:
  application:
    name: vehicles-service
  
  data:
    mongodb:
      uri: mongodb://localhost:27017/vehicles_db
      database: vehicles_db
        
  profiles:
    active: dev

# Management endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# Logging configurations  
logging:
  level:
    com.skt.combustible.vehicles: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

# gRPC Configuration
grpc:
  server:
    port: 9092
    
# Service Discovery (para comunicación entre microservicios)
service:
  urls:
    drivers-service: http://localhost:8081
    routes-service: http://localhost:8083
    fuel-service: http://localhost:8084
    auth-service: http://localhost:8085
