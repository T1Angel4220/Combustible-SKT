syntax = "proto3";

package com.skt.combustible.vehicles.grpc;

option java_multiple_files = true;
option java_package = "com.skt.combustible.vehicles.grpc";
option java_outer_classname = "VehicleProto";

// Import Google's empty message
import "google/protobuf/empty.proto";

// Enums
enum TipoMaquinariaProto {
    CAMION = 0;
    VOLQUETE = 1;
    EXCAVADORA = 2;
    CARGADOR = 3;
    GRUA = 4;
    MOTONIVELADORA = 5;
}

enum EstadoOperativoProto {
    DISPONIBLE = 0;
    EN_USO = 1;
    MANTENIMIENTO = 2;
    FUERA_DE_SERVICIO = 3;
    ASIGNADO = 4;
}

// Vehicle Messages
message VehicleCreateRequestProto {
    string placa = 1;
    string marca = 2;
    string modelo = 3;
    int32 anio = 4;
    TipoMaquinariaProto tipoMaquinaria = 5;
    EstadoOperativoProto estadoOperativo = 6;
    double capacidadTanque = 7;
    double consumoPromedio = 8;
    double kilometrajeActual = 9;
    bool activo = 10;
}

message VehicleUpdateRequestProto {
    string placa = 1;
    string marca = 2;
    string modelo = 3;
    int32 anio = 4;
    TipoMaquinariaProto tipoMaquinaria = 5;
    EstadoOperativoProto estadoOperativo = 6;
    double capacidadTanque = 7;
    double consumoPromedio = 8;
    double kilometrajeActual = 9;
    bool activo = 10;
}

message VehicleResponseProto {
    string id = 1;
    string placa = 2;
    string marca = 3;
    string modelo = 4;
    int32 anio = 5;
    TipoMaquinariaProto tipoMaquinaria = 6;
    EstadoOperativoProto estadoOperativo = 7;
    double capacidadTanque = 8;
    double consumoPromedio = 9;
    double kilometrajeActual = 10;
    bool activo = 11;
    string fechaCreacion = 12;
    string fechaActualizacion = 13;
}

message VehicleIdRequestProto {
    string id = 1;
}

message VehiclePlacaRequestProto {
    string placa = 1;
}

message VehicleTipoRequestProto {
    TipoMaquinariaProto tipoMaquinaria = 1;
}

message VehicleEstadoRequestProto {
    EstadoOperativoProto estadoOperativo = 1;
}

message VehicleKilometrajeRequestProto {
    string id = 1;
    double kilometraje = 2;
}

message VehicleStatsResponseProto {
    int64 totalVehiculos = 1;
    int64 vehiculosActivos = 2;
    int64 vehiculosDisponibles = 3;
    int64 vehiculosEnUso = 4;
    int64 vehiculosEnMantenimiento = 5;
    double kilometrajePromedio = 6;
    double consumoPromedioTotal = 7;
}

// Vehicle Service Definition
service VehicleServiceProto {
    // CRUD Operations
    rpc CrearVehiculo(VehicleCreateRequestProto) returns (VehicleResponseProto);
    rpc ObtenerVehiculoPorId(VehicleIdRequestProto) returns (VehicleResponseProto);
    rpc ObtenerVehiculoPorPlaca(VehiclePlacaRequestProto) returns (VehicleResponseProto);
    rpc ObtenerTodosLosVehiculos(google.protobuf.Empty) returns (stream VehicleResponseProto);
    rpc ActualizarVehiculo(VehicleUpdateRequestProto) returns (VehicleResponseProto);
    rpc DesactivarVehiculo(VehicleIdRequestProto) returns (google.protobuf.Empty);
    
    // Query Operations
    rpc ObtenerVehiculosPorTipo(VehicleTipoRequestProto) returns (stream VehicleResponseProto);
    rpc ObtenerVehiculosPorEstado(VehicleEstadoRequestProto) returns (stream VehicleResponseProto);
    rpc ObtenerVehiculosDisponibles(google.protobuf.Empty) returns (stream VehicleResponseProto);
    rpc ObtenerVehiculosDisponiblesPorTipo(VehicleTipoRequestProto) returns (stream VehicleResponseProto);
    
    // Update Operations
    rpc CambiarEstadoVehiculo(VehicleEstadoRequestProto) returns (VehicleResponseProto);
    rpc ActualizarKilometraje(VehicleKilometrajeRequestProto) returns (VehicleResponseProto);
    
    // Statistics
    rpc ObtenerEstadisticas(google.protobuf.Empty) returns (VehicleStatsResponseProto);
}
